name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install GTK4 system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgirepository-2.0-dev gir1.2-gtk-4.0 libcairo2-dev pkg-config
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Run tests
        run: python -m pytest -q

  install-and-entrypoint:
    name: Linux venv editable install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system GTK/PyGObject dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-4.0 libgirepository-2.0-dev libcairo2-dev pkg-config
      - name: Create supported venv and install package
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Validate installed entry point and imports
        run: |
          . .venv/bin/activate
          command -v netfather
          python -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; import gui.app; print('NetFather import/entry-point contract OK')"

  linux-firewall-integration:
    name: Linux network namespace / nftables integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OS integration tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 iputils-ping libgirepository-2.0-dev gir1.2-gtk-4.0 libcairo2-dev pkg-config
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Verify privileged network test prerequisites
        run: |
          set -euxo pipefail
          sudo -n true
          sudo -n ip -Version
          sudo -n nft --version
          sudo -n ip netns add netfather-ci-probe
          sudo -n ip netns exec netfather-ci-probe ip link show
          sudo -n ip netns del netfather-ci-probe
      - name: Run isolated firewall integration test
        run: |
          set -euxo pipefail
          PYTHON_BIN="$(command -v python)"
          sudo -E "${PYTHON_BIN}" -m pytest -vv -s tests/integration/test_firewall_netns.py
