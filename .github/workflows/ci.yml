name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install GTK4 system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev gir1.2-gtk-4.0 libcairo2-dev pkg-config
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Run tests
        run: python -m pytest -q

  linux-firewall-integration:
    name: Linux network namespace / nftables integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OS integration tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 iputils-ping
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Run isolated firewall integration test
        run: sudo -E "$(command -v python)" -m pytest -q tests/integration/test_firewall_netns.py
