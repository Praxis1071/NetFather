name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag matching core/version.py"
        required: true
        default: "v0.5.0"
      publish_release:
        description: "Publish/update the GitHub Release after build"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate Linux release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK4 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev gir1.2-gtk-4.0 libcairo2-dev pkg-config
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10" "pyinstaller>=6.22,<7"
      - name: Check version/tag consistency
        run: python scripts/check_version.py --tag "${RELEASE_TAG}"
      - name: Run tests
        run: python -m pytest -q
      - name: Build GTK4 executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name netfather netfather.py
      - name: Package Linux x64 release
        run: python scripts/package_release.py --target linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: release/NetFather-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-linux-x64
          path: release-assets
      - name: Generate SHA256SUMS
        shell: bash
        run: cd release-assets && sha256sum NetFather-* > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* --title "NetFather ${RELEASE_TAG}" --generate-notes --target "${GITHUB_SHA}"
          fi
