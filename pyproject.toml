[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netfather"
version = "0.5.0"
description = "Linux üzerinde yerel ağ cihaz keşfi, profil, zamanlama ve erişim yönetimi için GTK4 uygulaması."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyGObject>=3.46,<4",
    "SQLAlchemy>=2.0,<2.1",
    "psutil>=5.9,<8",
    "scapy>=2.6,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Praxis1071/NetFather"
Releases = "https://github.com/Praxis1071/NetFather/releases"
Issues = "https://github.com/Praxis1071/NetFather/issues"

[project.scripts]
netfather = "gui.app:main"

[tool.setuptools]
include-package-data = false
packages = ["core", "gui", "network", "models", "manager", "monitor", "scheduler", "firewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
