[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netfather"
version = "0.1.0"
description = "Yerel ağ cihaz ve erişim yönetim aracı (CLI)."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "SQLAlchemy>=2.0,<3.0",
]

[project.scripts]
netfather = "cli.main:run"

[tool.setuptools]
packages = ["core", "cli", "network", "models", "manager", "monitor", "scheduler"]
